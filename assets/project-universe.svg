<svg width="678" height="290" viewBox="0 0 678 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160f28"/>
      <stop offset="100%" stop-color="#0a0714"/>
    </linearGradient>
    <radialGradient id="uCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="uGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="uCoreBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      <![CDATA[
        .uorbit { transform-box: fill-box; transform-origin: 540px 145px; }
        .uoA { animation: uspin 14s linear infinite; }
        .uoB { animation: uspin 21s linear infinite reverse; }
        @keyframes uspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .ustar { animation: utwinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        .ustar.u1 { animation-delay: 0s; } .ustar.u2 { animation-delay: .5s; } .ustar.u3 { animation-delay: 1s; } .ustar.u4 { animation-delay: 1.5s; }
        @keyframes utwinkle { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
        .kicker { font-family: 'JetBrains Mono','Courier New',monospace; font-size: 12px; fill: #7c6ba0; letter-spacing: 2px; }
        .label { font-family: 'Inter','Segoe UI',sans-serif; font-size: 13.5px; fill: #b7adda; }
      ]]>
    </style>
  </defs>

  <rect width="678" height="290" rx="18" fill="url(#uBg)"/>
  <rect width="678" height="290" rx="18" fill="none" stroke="#2a2145" stroke-width="1"/>

  <g transform="translate(40,44)">
    <text class="kicker" y="0">THREE.JS · GITHUB API</text>
    <text y="38" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#f5f3ff">GitHub Universe 3D</text>

    <text class="label" y="72" xml:space="preserve">Type in a username, watch their</text>
    <text class="label" y="93" xml:space="preserve">contribution history become a</text>
    <text class="label" y="114" xml:space="preserve">navigable 3D universe.</text>

    <text font-family="'JetBrains Mono','Courier New',monospace" font-size="12.5" y="154" fill="#8b7fb0">commits <tspan fill="#c084fc">→</tspan> stars</text>
    <text font-family="'JetBrains Mono','Courier New',monospace" font-size="12.5" y="176" fill="#8b7fb0">repos <tspan fill="#c084fc">→</tspan> worlds</text>
  </g>

  <!-- mini render scene, right side -->
  <g transform="translate(0,0)">
    <g class="uoB" opacity="0.5">
      <ellipse cx="540" cy="145" rx="118" ry="52" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1"/>
    </g>
    <g class="uoA" opacity="0.75">
      <ellipse cx="540" cy="145" rx="78" ry="34" fill="none" stroke="#a855f7" stroke-opacity="0.7" stroke-width="1.2"/>
    </g>

    <g fill="#f5f3ff">
      <circle class="ustar u1" cx="470" cy="60" r="1.4"/>
      <circle class="ustar u3" cx="610" cy="80" r="1.2"/>
      <circle class="ustar u2" cx="450" cy="220" r="1.3"/>
      <circle class="ustar u4" cx="620" cy="210" r="1.1"/>
      <circle class="ustar u1" cx="590" cy="240" r="1"/>
      <circle class="ustar u3" cx="480" cy="240" r="1.2"/>
    </g>

    <g class="uoA">
      <circle cx="618" cy="145" r="3" fill="#f5f3ff"/>
      <circle cx="618" cy="145" r="7" fill="url(#uGlow)"/>
    </g>
    <g class="uoB">
      <circle cx="422" cy="145" r="2.6" fill="#e9d5ff"/>
      <circle cx="422" cy="145" r="6" fill="url(#uGlow)"/>
    </g>

    <circle cx="540" cy="145" r="24" fill="url(#uCore)" opacity="0.35" filter="url(#uCoreBlur)"/>
    <circle cx="540" cy="145" r="12" fill="url(#uCore)"/>
    <circle cx="540" cy="145" r="12" fill="none" stroke="#f5f3ff" stroke-opacity="0.5" stroke-width="1"/>
  </g>
</svg>
