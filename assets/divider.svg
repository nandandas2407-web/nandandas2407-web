<svg width="1400" height="80" viewBox="0 0 1400 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="8%" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="92%" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineFadeThin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="15%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>

  <!-- main solid line, no blur -->
  <rect x="0" y="38" width="1400" height="3" fill="url(#lineFade)"/>

  <!-- thin accent line above for depth (still solid fill, not blurred) -->
  <rect x="0" y="34" width="1400" height="1" fill="url(#lineFadeThin)"/>

  <!-- side ticks -->
  <rect x="660" y="30" width="2" height="20" fill="#a855f7"/>
  <rect x="738" y="30" width="2" height="20" fill="#a855f7"/>

  <!-- diamond core ornament -->
  <g transform="translate(700,40) rotate(45)">
    <rect x="-9" y="-9" width="18" height="18" fill="url(#coreGlow)" stroke="#f3e8ff" stroke-width="1"/>
  </g>

  <!-- outer ring accents -->
  <circle cx="700" cy="40" r="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
  <circle cx="700" cy="40" r="22" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
</svg>
